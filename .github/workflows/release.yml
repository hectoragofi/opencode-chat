# Builds the Windows installer + auto-update artifacts on version tags.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The workflow stamps the version (from the tag) into package.json,
# tauri.conf.json and Cargo.toml, builds everything, and creates a DRAFT
# GitHub release with:
#   - OpenCode Chat_<version>_x64-setup.exe   (full installer)
#   - *.nsis.zip + *.nsis.zip.sig             (auto-update bundle)
#   - latest.json                             (auto-update feed)
#
# Review the draft, then press Publish — publishing is what makes the
# desktop app offer the update (it polls releases/latest/download/latest.json).
#
# Required repository secrets (Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           full contents of the updater private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   UPDATE_PAT  fine-grained PAT, contents:read on this repo only.
#               Baked into the updater feed URL headers at build time so the
#               app can poll releases on this PRIVATE repo. If the repo ever
#               goes public, this can be removed (and the headers with it).

name: Release

on:
  # Local builds are the release path (see README). This workflow is kept as
  # a documented reference / manual fallback — it does NOT run on tags.
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        shell: node {0}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          const fs = require("node:fs");
          const version = process.env.TAG.replace(/^v/, "");
          if (!/^\d+\.\d+\.\d+/.test(version)) throw new Error(`bad tag: ${process.env.TAG}`);
          // root package.json (also stamps the sidecar exe via build-exe.mjs)
          const pkgPath = "package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          // tauri.conf.json (the version the updater compares against)
          const confPath = "desktop/src-tauri/tauri.conf.json";
          const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
          conf.version = version;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
          // Cargo.toml (keep in sync; tauri falls back to it)
          const cargoPath = "desktop/src-tauri/Cargo.toml";
          fs.writeFileSync(
            cargoPath,
            fs.readFileSync(cargoPath, "utf8").replace(/^version = ".*"/m, `version = "${version}"`),
          );
          console.log(`stamped version ${version}`);

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Build sidecar server exe
        run: |
          npm ci
          npm run build:exe -- --skip-web

      - name: Stage sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/OpenCodeChat.exe `
            -Destination desktop/src-tauri/binaries/opencode-chat-server-x86_64-pc-windows-msvc.exe -Force

      - name: Install desktop tooling
        run: |
          cd desktop
          npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build installer + updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the app at compile time (option_env! in main.rs) so the
          # updater can poll releases on this private repo.
          UPDATE_TOKEN: ${{ secrets.UPDATE_PAT }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: "See the assets below to download and install. The desktop app updates itself automatically once this release is published."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: --target x86_64-pc-windows-msvc

      # tauri-action does not emit the updater bundle for our setup, so we
      # build it ourselves: zip the NSIS installer, minisign it with the
      # updater key, and publish latest.json (the feed the app polls).
      - name: Build updater bundle
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $nsisDir = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $setup = Get-ChildItem $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "no *-setup.exe found in $nsisDir" }
          # GitHub rewrites spaces to dots in asset names; rename first so the
          # feed URL matches the uploaded file exactly.
          $zipName = ($setup.BaseName + ".nsis.zip") -replace ' ', '.'
          $zip = Join-Path $nsisDir $zipName
          Compress-Archive -Path $setup.FullName -DestinationPath $zip -Force
          $zipFull = (Resolve-Path $zip).Path
          cd desktop
          npx tauri signer sign "$zipFull"

      - name: Publish latest.json
        shell: node {0}
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const version = process.env.TAG.replace(/^v/, "");
          const nsisDir = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis";
          const zipName = fs.readdirSync(nsisDir).find((f) => f.endsWith(".nsis.zip"));
          if (!zipName) throw new Error("no .nsis.zip found");
          const sig = fs.readFileSync(path.join(nsisDir, zipName + ".sig"), "utf8");
          const repo = "hectoragofi/opencode-chat";
          const feed = {
            version,
            notes: `v${version} — see the release page for details.`,
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": {
                signature: sig,
                url: `https://github.com/${repo}/releases/download/${process.env.TAG}/${zipName}`,
              },
            },
          };
          fs.writeFileSync("latest.json", JSON.stringify(feed, null, 2) + "\n");
          const run = (args) => execFileSync("gh", args, { stdio: "inherit" });
          run(["release", "upload", process.env.TAG, "--repo", repo, "--clobber",
            path.join(nsisDir, zipName), path.join(nsisDir, zipName + ".sig"), "latest.json"]);
          console.log("updater feed published");
